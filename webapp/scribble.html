<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Vanya Scribble</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101325;color:#fff;font:14px system-ui}.app{max-width:1080px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;color:#aab0cf}.bar,.card{background:#191c33;border:1px solid #30365b;border-radius:16px}.bar{padding:9px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar>*{background:#252944;color:#fff;border:1px solid #3a4065;border-radius:9px;padding:8px}.primary{background:#8277ff!important}.layout{display:grid;grid-template-columns:1fr 300px;gap:10px}.card{padding:10px}.board{background:#fff;border-radius:12px;overflow:hidden;aspect-ratio:4/3}.board canvas{display:block;width:100%;height:100%;touch-action:none}.status{padding:8px 2px 0;color:#aab0cf}.players{display:flex;flex-direction:column;gap:6px;margin-top:8px}.p{background:#252944;padding:7px;border-radius:8px}.chat{height:310px;display:flex;flex-direction:column;margin-top:8px}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:5px}.m{background:#252944;padding:6px;border-radius:8px}.chatrow{display:flex;gap:6px;margin-top:7px}.chatrow input{flex:1;min-width:0}input,select,button{font:inherit}@media(max-width:760px){.layout{grid-template-columns:1fr}.chat{height:220px}}
</style></head>
<body><div class="app">
<div class="top"><div><div class="title">🖌️ Vanya Scribble</div><div class="sub">Draw together in real time</div></div><div id="room">No room</div></div>
<div class="bar"><button id="new" class="primary">➕ New Room</button><input id="code" maxlength="6" placeholder="Room code"><button id="join">Join</button><select id="color"><option value="#111">Black</option><option value="#e34d5a">Red</option><option value="#3779e8">Blue</option><option value="#3bbf70">Green</option><option value="#8b63ee">Purple</option><option value="#f2b84b">Yellow</option><option value="#fff">Eraser</option></select><input id="size" type="range" min="2" max="28" value="6"><button id="clear">🧽 Clear</button></div>
<div class="layout"><div class="card"><div class="board"><canvas id="c"></canvas></div><div class="status" id="st">Create or join a room to start drawing.</div></div>
<div class="card"><b>👥 Players</b><div class="players" id="ps"></div><hr style="border:0;border-top:1px solid #30365b;margin:12px 0"><b>💬 Room Chat</b><div class="chat"><div class="msgs" id="ms"></div><div class="chatrow"><input id="ct" placeholder="Type…"><button id="send">Send</button></div></div></div></div></div>
<script>
const tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:null;if(tg){try{tg.ready();tg.expand()}catch(e){}}
const c=document.getElementById('c'),x=c.getContext('2d'),box=c.parentElement,st=document.getElementById('st');let ws=null,code=new URLSearchParams(location.search).get('room')||'',down=false,last=null;
const u=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{id:'guest-'+Math.random().toString(36).slice(2),first_name:'Guest'},uid=String(u.id),name=u.first_name||'Player';
function fit(){const r=box.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)}new ResizeObserver(fit).observe(box);fit();
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pos(e){const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
function stroke(s){if(!s)return;const r=c.getBoundingClientRect();x.strokeStyle=s.color;x.lineWidth=s.size;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(s.a.x*r.width,s.a.y*r.height);x.lineTo(s.b.x*r.width,s.b.y*r.height);x.stroke()}
function connect(){if(ws)try{ws.close()}catch(e){}if(!code)return;document.getElementById('room').textContent='Room '+code;const p=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(p+'://'+location.host+'/ws/scribble/'+encodeURIComponent(code)+'?cid='+encodeURIComponent(uid)+'&name='+encodeURIComponent(name)+(tg?'&initData='+encodeURIComponent(tg.initData):''));ws.onopen=()=>{st.textContent='🟢 Connected';ws.send(JSON.stringify({type:'join',name}))};ws.onclose=()=>st.textContent='🔴 Disconnected';ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(_){return}if(d.type==='state'){document.getElementById('ps').innerHTML=(d.players||[]).map(p=>'<div class="p">🟢 '+esc(p.name)+(String(p.id)===uid?' <small>(You)</small>':'')+'</div>').join('');fit();(d.strokes||[]).forEach(stroke)}else if(d.type==='stroke')stroke(d.stroke);else if(d.type==='clear')fit();else if(d.type==='chat'){const q=document.createElement('div');q.className='m';q.innerHTML='<b>'+esc(d.name)+'</b> '+esc(d.text);document.getElementById('ms').appendChild(q);document.getElementById('ms').scrollTop=1e9}else if(d.type==='error')st.textContent='⚠️ '+d.message}}
document.getElementById('new').onclick=async()=>{try{const r=await fetch('/api/scribble/rooms',{method:'POST'}),d=await r.json();if(!d.ok)throw Error(d.error||'Create failed');code=d.room;document.getElementById('code').value=code;connect()}catch(e){st.textContent='⚠️ '+e.message}};
document.getElementById('join').onclick=()=>{code=document.getElementById('code').value.trim().toUpperCase();if(code)connect()};
document.getElementById('clear').onclick=()=>ws&&ws.readyState===1&&ws.send(JSON.stringify({type:'clear'}));
c.onpointerdown=e=>{if(!ws||ws.readyState!==1)return;down=true;last=pos(e);c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!down||!last)return;const b=pos(e),s={a:last,b,color:document.getElementById('color').value,size:+document.getElementById('size').value};stroke(s);ws.send(JSON.stringify({type:'stroke',stroke:s}));last=b};
['pointerup','pointercancel','pointerleave'].forEach(ev=>c.addEventListener(ev,()=>{down=false;last=null}));
function send(){const z=document.getElementById('ct'),t=z.value.trim();if(t&&ws&&ws.readyState===1){ws.send(JSON.stringify({type:'chat',text:t}));z.value=''}}document.getElementById('send').onclick=send;document.getElementById('ct').onkeydown=e=>e.key==='Enter'&&send();
if(code){document.getElementById('code').value=code;connect()}
</script></body></html>
