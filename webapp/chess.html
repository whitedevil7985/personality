<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vanya Chess</title><style>
:root{--bg:#0b0b1b;--panel:#17172d;--purple:#34245e;--light:#c8d5e8;--dark:#415273;--accent:#00e7e9;--gold:#f2c94c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080817,#10102a);font-family:system-ui,-apple-system,sans-serif;color:#fff;min-height:100vh}.top{padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:4px;font-size:20px}.live{color:var(--accent);font-weight:700;font-size:12px}.room{margin:4px 8px 10px;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,#25204b,#1a1940);border:1px solid #443c73}.players{display:flex;justify-content:space-between;gap:8px}.p{flex:1;min-width:0}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;color:#a7b1c8}.boardwrap{padding:8px}.board{width:min(100%,430px);margin:auto;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #141b30;border-radius:4px;overflow:hidden;box-shadow:0 12px 35px #0008}.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(27px,8vw,46px);cursor:pointer;user-select:none}.sq.light{background:var(--light);color:#172033}.sq.dark{background:var(--dark);color:#fff}.sq.sel{outline:4px solid var(--accent);outline-offset:-4px}.sq.target{box-shadow:inset 0 0 0 5px #00e7e988}.rank,.file{position:absolute;font-size:9px;font-weight:700;opacity:.55}.rank{right:3px;top:2px}.file{left:3px;bottom:2px}.bottom{padding:8px 14px 18px}.bar{background:#151a31;border-radius:18px;padding:12px;border:1px solid #303653}.turn{color:var(--gold);font-weight:800}.buttons{display:flex;gap:8px;margin-top:9px}.btn{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;background:#242642;color:#fff}.primary{background:#3a2d6d}.danger{background:#5c2631}.lobby{padding:16px}.code{font-family:monospace;background:#090912;padding:8px;border-radius:8px}.hidden{display:none}.chat{max-height:130px;overflow:auto;margin-top:8px;font-size:12px}.err{color:#ff8c8c;min-height:18px;font-size:12px;margin-top:6px}</style></head><body><div class="top"><div><div class="live">• LIVE</div><div class="brand">VANYA CHESS</div></div><button class="btn" id="help">?</button></div><div id="app"></div><script>
const tg=window.Telegram?.WebApp; tg?.ready();tg?.expand();let ws=null,room=new URLSearchParams(location.search).get('room')||'',me='Player',you='',selected=null,state=null;
const app=document.getElementById('app');const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(u,o={}){const r=await fetch(u,o);return r.json()} async function ensure(){if(room)return;const r=await api('/api/chess/rooms'+(new URLSearchParams(location.search).get('gc')?'?gc='+encodeURIComponent(new URLSearchParams(location.search).get('gc')):''),{method:'POST'});if(r.ok){room=r.room;history.replaceState({},'',`/chess?room=${room}`)}}
function name(){return tg?.initDataUnsafe?.user?.first_name||'Player'}
function lobby(){app.innerHTML=`<div class="lobby"><div class="room"><div class="status">ROOM CODE</div><div class="code">${esc(room)}</div><div class="status" style="margin-top:8px">Share this room with one friend.</div></div><div id="players"></div><div class="buttons"><button class="btn" id="bot">🤖 Add Bot</button><button class="btn primary" id="start">▶ Start Game</button></div><div class="err" id="err"></div></div>`;document.getElementById('bot').onclick=()=>send({type:'add_bot'});document.getElementById('start').onclick=()=>send({type:'start'})}
function render(){if(!state||!state.started){lobby();if(state?.players){document.getElementById('players').innerHTML=state.players.map(p=>`<div class="room"><div class="name">${esc(p.name)} <span class="status">${p.color.toUpperCase()}</span></div><div class="status">${p.connected?'● Online':'○ Offline'} ${p.bot?'• BOT':''}</div></div>`).join('')}return}app.innerHTML=`<div class="room"><div class="players">${state.players.map(p=>`<div class="p"><div class="name">${p.color==='white'?'♔':'♚'} ${esc(p.name)} ${p.id===state.you?'(You)':''}</div><div class="status">${p.connected?'● Online':'○ Offline'}</div></div>`).join('')}</div></div><div class="boardwrap"><div class="board" id="board"></div></div><div class="bottom"><div class="bar"><div class="turn">${state.winner?`🏆 ${esc(state.players.find(p=>p.id===state.winner)?.name||'Winner')} wins!`:state.turn.toUpperCase()+' TURN'} ${state.check&&!state.winner?'• CHECK':''}</div><div class="status">Room ${esc(room)} · ${state.checkmate?'Checkmate':''}</div><div class="buttons"><button class="btn danger" id="resign">🏳 Resign</button><button class="btn" id="chatbtn">💬 Chat</button></div><div class="chat">${(state.chat||[]).map(x=>`<div><b>${esc(x.name)}:</b> ${esc(x.text)}</div>`).join('')}</div><div class="err" id="err"></div></div></div>`;drawBoard();document.getElementById('resign').onclick=()=>send({type:'resign'});document.getElementById('chatbtn').onclick=()=>{const t=prompt('Message');if(t)send({type:'chat',text:t})}}
function drawBoard(){const b=document.getElementById('board');const pieces={};(state.pieces||[]).forEach(x=>pieces[x.square]=x.piece);for(let r=7;r>=0;r--)for(let f=0;f<8;f++){const sq=String.fromCharCode(97+f)+(r+1),d=document.createElement('div');d.className='sq '+(((r+f)%2)?'dark':'light')+(selected===sq?' sel':'');d.dataset.sq=sq;d.textContent=pieces[sq]||'';const rk=document.createElement('span');rk.className='rank';rk.textContent=(f===7?r+1:'');const fl=document.createElement('span');fl.className='file';fl.textContent=(r===0?String.fromCharCode(97+f):'');d.append(rk,fl);d.onclick=()=>squareClick(sq);b.appendChild(d)}}
function squareClick(sq){if(!state||state.winner)return;if(state.players.find(p=>p.id===state.you)?.color!==state.turn)return;if(!selected){if(!state.pieces.some(x=>x.square===sq))return;selected=sq;drawBoard();return}if(selected===sq){selected=null;drawBoard();return}send({type:'move',uci:selected+sq});selected=null}
function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}
function connect(){ws=new WebSocket(`${location.origin.replace(/^http/,'ws')}/ws/chess/${encodeURIComponent(room)}?initData=${encodeURIComponent(tg?.initData||'')}`);ws.onopen=()=>send({type:'join',name:name()});ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='error'){const el=document.getElementById('err');if(el)el.textContent=d.message;return}if(d.type==='state'){state=d;render()}};ws.onclose=()=>setTimeout(connect,1600)}
(async()=>{await ensure();me=name();lobby();connect()})();document.getElementById('help').onclick=()=>alert('Tap a piece, then tap its destination. White moves first. Invite one player or add a bot.');
</script></body></html>
