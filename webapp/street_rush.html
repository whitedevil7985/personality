<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Subway</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111b;touch-action:none;font-family:Arial,sans-serif}#game{position:relative;width:min(100vw,62.5vh);height:min(100vh,160vw);max-width:100vw;max-height:100vh;margin:auto;overflow:hidden;background:#87d6ff}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;color:#fff;text-shadow:0 2px 4px #000}.box{background:#182633aa;border:1px solid #ffffff44;border-radius:12px;padding:7px 10px}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#162431cc;color:#fff;padding:9px 13px;border-radius:12px;font-size:12px;font-weight:bold;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.hint.on{opacity:1}.cover{position:absolute;inset:0;background:#07152199;display:grid;place-items:center}.panel{background:#102333ee;border:1px solid #ffffff33;border-radius:20px;padding:24px;text-align:center;color:white;width:85%;box-shadow:0 20px 60px #0009}.panel h1{margin:0 0 8px;font-size:34px}.btn{border:0;border-radius:12px;padding:12px 25px;font-weight:900;font-size:16px;background:#ffd33d;color:#2a2100}.hide{display:none!important}
</style></head><body><div id="game"><canvas id="c"></canvas><div class="hud"><div><span class="box">🪙 <b id="coin">0</b></span></div><div><span class="box">⭐ <b id="score">000000</b></span></div></div><div id="hint" class="hint">← → Move &nbsp; ↑ Jump &nbsp; ↓ Slide</div>
<div id="start" class="cover"><div class="panel"><h1>🚇 SUBWAY</h1><p>Swipe to move, jump and slide.</p><button class="btn" id="play">PLAY</button></div></div>
<div id="over" class="cover hide"><div class="panel"><h1>RUN OVER</h1><p>Score: <b id="final">0</b></p><button class="btn" id="again">RUN AGAIN</button></div></div></div>
<script>
(()=>{const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=540,H=960;cv.width=W;cv.height=H;
let run=false,t=0,last=0,lane=1,target=1,jump=0,slide=0,score=0,coins=0,speed=.27,obs=[],money=[],hintTimer;
function X(l,z){return W/2+(l-1)*(55+235*((z+1)/2))} function Y(z){return 260+570*((z+1)/2)} function scale(z){return .18+1.02*((z+1)/2)}
function bg(){let g=ctx.createLinearGradient(0,0,0,235);g.addColorStop(0,'#61c8f5');g.addColorStop(1,'#c2edff');ctx.fillStyle=g;ctx.fillRect(0,0,W,235);ctx.fillStyle='#fff';ctx.globalAlpha=.5;[[55,72,40],[160,100,45],[280,55,40],[400,88,48],[500,65,40]].forEach(a=>{ctx.beginPath();ctx.ellipse(a[0],a[1],a[2],13,0,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.fillStyle='#e8c696';ctx.fillRect(0,235,W,725)}
function road(){ctx.fillStyle='#7d665e';ctx.beginPath();ctx.moveTo(205,235);ctx.lineTo(335,235);ctx.lineTo(475,960);ctx.lineTo(65,960);ctx.closePath();ctx.fill();for(let l=0;l<3;l++){for(const off of[-.36,.36]){ctx.strokeStyle='#d9dddd';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(270+(l-1)*12+off*35,235);ctx.lineTo(270+(l-1)*130+off*125,960);ctx.stroke()}}for(let z=-.9;z<=.95;z+=.11){let y=Y(z),w=55+235*((z+1)/2);ctx.strokeStyle='#4b3934';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W/2-w,y);ctx.lineTo(W/2+w,y);ctx.stroke()}}
function train(o){let z=o.z,s=scale(z),x=X(o.l,z),y=Y(z),w=44*s,h=68*s;ctx.save();ctx.translate(x,y);ctx.fillStyle='#e95d38';ctx.fillRect(-w/2,-h*.48,w,h*.2);ctx.fillStyle='#2b98bd';ctx.fillRect(-w/2,-h*.28,w,h*.7);ctx.fillStyle='#f4d143';ctx.fillRect(-w/2,-h*.05,w,h*.17);ctx.fillStyle='#a5ebff';for(let i=-1;i<=1;i++)ctx.fillRect(i*w*.25-w*.1,-h*.17,w*.16,h*.2);ctx.fillStyle='#27363a';ctx.beginPath();ctx.arc(-w*.25,h*.45,w*.12,0,Math.PI*2);ctx.arc(w*.25,h*.45,w*.12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(0,h*.58,w*.65,h*.12,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function coin(c){let z=c.z,s=scale(z),x=X(c.l,z),y=Y(z)-45*s;ctx.save();ctx.translate(x,y);ctx.rotate(t*5);ctx.fillStyle='#ffd42f';ctx.strokeStyle='#fff1a0';ctx.lineWidth=2*s;ctx.beginPath();ctx.arc(0,0,9*s,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font=(12*s)+'px Arial';ctx.textAlign='center';ctx.fillText('$',0,4*s);ctx.restore()}
function round(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function player(){let x=X(lane,1),y=835-jump*180,r=Math.sin(t*18)*7;ctx.save();ctx.translate(x,y);if(slide)ctx.scale(1.2,.62);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(0,18,48,13,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#26313c';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(-9,25);ctx.lineTo(-16+r,70);ctx.moveTo(9,25);ctx.lineTo(16-r,70);ctx.stroke();ctx.fillStyle='#f4f6f8';ctx.fillRect(-29+r,65,28,11);ctx.fillRect(5-r,65,28,11);round(-27,-67,54,80,15,'#159fd0');ctx.fillStyle='#123b58';ctx.fillRect(-26,-5,52,13);ctx.strokeStyle='#1493c0';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-22,-48);ctx.lineTo(-38-r,-7);ctx.moveTo(22,-48);ctx.lineTo(38+r,-7);ctx.stroke();ctx.fillStyle='#dca27b';ctx.beginPath();ctx.arc(0,-91,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202833';ctx.beginPath();ctx.arc(0,-100,26,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-25,-105,50,8);ctx.restore()}
function spawn(){let l=Math.floor(Math.random()*3);obs.push({l,z:-.98});if(Math.random()<.65)for(let i=0;i<7;i++)money.push({l,z:-.72-i*.09})}
function showHint(){let h=document.getElementById('hint');h.classList.add('on');clearTimeout(hintTimer);hintTimer=setTimeout(()=>h.classList.remove('on'),2200)}
function start(){run=true;t=0;last=performance.now();lane=target=1;jump=slide=0;score=coins=0;speed=.27;obs=[];money=[];document.getElementById('start').classList.add('hide');document.getElementById('over').classList.add('hide');showHint();requestAnimationFrame(loop)}
function move(a){if(!run)return;showHint();if(a==='l')target=Math.max(0,target-1);if(a==='r')target=Math.min(2,target+1);if(a==='j'&&!jump&&!slide)jump=1;if(a==='s'&&!jump)slide=.7}
let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?'r':'l'):move(dy<0?'j':'s')},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move('l');if(e.key==='ArrowRight')move('r');if(e.key==='ArrowUp')move('j');if(e.key==='ArrowDown')move('s')});
function update(dt){t+=dt;lane+=(target-lane)*Math.min(1,dt*10);jump=Math.max(0,jump-dt*1.5);slide=Math.max(0,slide-dt*1.4);speed=Math.min(.48,speed+dt*.006);for(const o of obs)o.z+=speed*dt;for(const c of money)c.z+=speed*dt;for(let i=obs.length-1;i>=0;i--){let o=obs[i];if(o.z>.9)obs.splice(i,1);else if(Math.abs(o.z-.72)<.07&&o.l===Math.round(lane)&&jump<.35){end();return}}for(let i=money.length-1;i>=0;i--){let c=money[i];if(c.z>.9)money.splice(i,1);else if(Math.abs(c.z-.72)<.06&&c.l===Math.round(lane)){coins++;score+=50;money.splice(i,1)}}if(Math.random()<dt*.9)spawn();score+=Math.floor(dt*90)}
function end(){run=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hide')}
function draw(){bg();road();for(const c of money)coin(c);for(const o of obs)train(o);player();document.getElementById('score').textContent=String(score).padStart(6,'0');document.getElementById('coin').textContent=coins}
function loop(now){if(!run)return;let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(run)requestAnimationFrame(loop)}
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;draw()})();
</script></body></html>
