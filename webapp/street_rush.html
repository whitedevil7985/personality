<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vanya Subway</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b10;touch-action:none;font-family:Arial,Helvetica,sans-serif}#game{position:relative;width:min(100vw,84.53vh);height:min(100vh,118.38vw);max-width:100vw;max-height:100vh;margin:auto;overflow:hidden;background:#b9eaff}canvas{display:block;width:100%;height:100%;background:#27353b url('https://images.unsplash.com/photo-1561526157-ba21578c1dc4?auto=format&fit=crop&fm=jpg&q=88&w=1800') center center/cover no-repeat;filter:saturate(1.12) contrast(1.06)}
.hud{position:absolute;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000;font-weight:900}.score{position:absolute;right:3.2%;top:1.4%;padding:11px 15px;border-radius:18px;background:#07111dcc;border:1px solid #ffffff30;font-size:clamp(18px,3.5vw,36px)}.score b{color:#ffc62e}.coin{position:absolute;left:2.2%;top:1.4%;padding:9px 14px;border-radius:18px;background:#07111dcc;border:1px solid #ffffff30;font-size:clamp(18px,3.5vw,36px)}.distance{position:absolute;left:2.2%;top:9.5%;padding:12px 17px;border-radius:18px;background:#07111dcc;border:1px solid #ffffff30;font-size:clamp(17px,3.1vw,32px)}.pause{position:absolute;right:3.2%;top:9.2%;width:64px;height:64px;border:0;border-radius:18px;background:#07111dcc;color:#fff;font-size:30px;font-weight:1000;pointer-events:auto}
.gesture{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);width:62%;min-width:300px;padding:12px 14px;border-radius:22px;background:#0b111acc;border:1px solid #ffffff44;text-align:center;font-size:clamp(12px,1.6vw,18px);line-height:1.55;opacity:0;transition:opacity .25s;backdrop-filter:blur(9px)}.gesture.show{opacity:1}.gesture .icons{font-size:clamp(25px,3.5vw,40px);letter-spacing:8px}
.cover{position:absolute;inset:0;display:grid;place-items:center;background:#06111c88;backdrop-filter:blur(2px);z-index:5}.panel{width:min(86%,470px);padding:28px;border-radius:28px;background:#081825ed;border:1px solid #ffffff33;box-shadow:0 25px 80px #000b;text-align:center;color:#fff}.panel h1{font-size:42px;margin:0 0 8px}.panel p{color:#d7e8f2}.play{border:0;border-radius:16px;padding:14px 30px;background:#ffc82e;color:#2a2100;font-size:18px;font-weight:1000}.hide{display:none!important}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="hud">
  <div id="coinHud" class="coin">🪙 <span id="coins">128</span></div>
  <div id="scoreHud" class="score"><span id="score">002743</span> <b>x<span id="mult">2</span></b></div>
  <div class="distance">⌖ <span id="distance">1.2 km</span></div>
  <button id="pause" class="pause">Ⅱ</button>
  <div id="gesture" class="gesture"><div class="icons">←　→　☝　↑　↓</div><b>Swipe to move</b>　|　<b>Swipe up to jump</b>　|　<b>Swipe down to slide</b></div>
</div>
<div id="start" class="cover"><div class="panel"><h1>🚇 SUBWAY</h1><p>Run through Vanya City. Swipe left/right to change tracks, up to jump and down to slide.</p><button id="play" class="play">START RUN</button></div></div>
<div id="over" class="cover hide"><div class="panel"><h1>RUN OVER</h1><p>Score <b id="finalScore">0</b> · Coins <b id="finalCoins">0</b></p><button id="again" class="play">RUN AGAIN</button></div></div>
</div>
<script>
(()=> {
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1153,H=1364,DPR=Math.min(devicePixelRatio||1,2);
cv.width=W*DPR;cv.height=H*DPR;ctx.scale(DPR,DPR);

let running=false,paused=false,last=0,time=0,dist=1.2,score=2743,coins=128,mult=2,speed=0.32;
let lane=1,target=1,jump=0,slide=0,shake=0,spawn=0,coinSpawn=0,flash=0;
let trains=[],coinTrail=[],particles=[],hintTimer=0;

const stars=[...Array(55)].map(()=>({x:Math.random()*W,y:Math.random()*245,r:1+Math.random()*3,a:.2+Math.random()*.5}));
const buildings=[];
for(let side of [-1,1]) for(let i=0;i<26;i++) buildings.push({side,i,w:50+Math.random()*75,h:80+Math.random()*230,off:Math.random()*45,col:[0x6c8790,0x8e8170,0x6d737c,0x9d927e,0x587884][i%5]});

function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function lerp(a,b,t){return a+(b-a)*t}
function depth(z){return Math.max(0,Math.min(1,(z+1)/2))}
function roadX(l,z){const d=depth(z);return W/2+(l-1)*lerp(38,245,d)}
function roadY(z){return lerp(250,1364,depth(z))}
function roadHalf(z){return lerp(75,520,depth(z))}

function drawSky(){ctx.save();ctx.globalAlpha=.13;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.restore();
  const g=ctx.createLinearGradient(0,0,0,280);g.addColorStop(0,'#61c7f5');g.addColorStop(.58,'#a7e3fa');g.addColorStop(1,'#d9f3ff');ctx.fillStyle=g;ctx.fillStyle='#101820';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.5;ctx.fillStyle='#fff';
  for(const s of stars){ctx.beginPath();ctx.ellipse(s.x,s.y,s.r*9,s.r*3,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
  // distant skyline
  ctx.fillStyle='#9aafba';for(let i=0;i<30;i++){let x=i*42+(i%3)*8,h=30+(i*17)%100;ctx.fillRect(x,248-h,38,h)}
  // buildings
  for(const b of buildings){
    const z=-.1+(b.i/26)*.95,d=depth(z),x=b.side<0?W/2-roadHalf(z)-b.w-b.off:W/2+roadHalf(z)+b.off;
    const y=roadY(z),hh=b.h*(.55+.55*d);ctx.fillStyle='#'+b.col.toString(16).padStart(6,'0');ctx.fillRect(x,y-hh,b.w,hh);
    ctx.fillStyle='#e9f5f5aa';for(let wy=y-hh+18;wy<y-10;wy+=30)for(let wx=x+10;wx<x+b.w-8;wx+=23)ctx.fillRect(wx,wy,9,12);
    ctx.fillStyle='#3d7855';ctx.beginPath();ctx.arc(x+b.w*.7,y-hh*.2,24*d+12,0,Math.PI*2);ctx.fill();
  }
  // sunlight
  const sun=ctx.createRadialGradient(860,140,5,860,140,280);sun.addColorStop(0,'#fff9c9aa');sun.addColorStop(1,'#fff9c900');ctx.fillStyle=sun;ctx.fillRect(500,0,653,500);
}

function drawCatenary(){
  ctx.strokeStyle='#53666e';ctx.lineWidth=7;
  for(let i=0;i<7;i++){let z=-.05+i*.17,y=roadY(z),d=depth(z),x1=W/2-roadHalf(z)-25,x2=W/2+roadHalf(z)+25;ctx.beginPath();ctx.moveTo(x1,y-520*d-110);ctx.lineTo(x1,y);ctx.moveTo(x2,y-520*d-110);ctx.lineTo(x2,y);ctx.stroke();ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y-520*d-110);ctx.lineTo(x2,y-520*d-110);ctx.stroke()}
  ctx.strokeStyle='#243239';ctx.lineWidth=2;
  for(let x of [W/2-150,W/2-70,W/2,W/2+70,W/2+150]){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,760);ctx.stroke()}
}

function drawTracks(){
  const g=ctx.createLinearGradient(0,250,0,H);g.addColorStop(0,'#6e625d');g.addColorStop(1,'#38302e');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(420,250);ctx.lineTo(733,250);ctx.lineTo(1110,1364);ctx.lineTo(42,1364);ctx.closePath();ctx.fill();
  // gravel
  ctx.fillStyle='#77706b';ctx.globalAlpha=.35;for(let i=0;i<500;i++){let x=60+Math.random()*1030,y=390+Math.random()*930;ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
  // sleepers and rails
  for(let z=-.92;z<1;z+=.075){let y=roadY(z),hw=roadHalf(z);ctx.strokeStyle='#332a27';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(W/2-hw,y);ctx.lineTo(W/2+hw,y);ctx.stroke()}
  for(let l=0;l<3;l++)for(let off of[-.42,.42]){ctx.strokeStyle='#d8dddc';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(roadX(l,-.05)+off*40,250);ctx.lineTo(roadX(l,.99)+off*180,1364);ctx.stroke();ctx.strokeStyle='#8e9798';ctx.lineWidth=3;ctx.stroke()}
  // platform edges
  ctx.fillStyle='#d2a66e';ctx.beginPath();ctx.moveTo(0,420);ctx.lineTo(360,270);ctx.lineTo(410,250);ctx.lineTo(45,1364);ctx.lineTo(0,1364);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(W,420);ctx.lineTo(793,270);ctx.lineTo(743,250);ctx.lineTo(1108,1364);ctx.lineTo(W,1364);ctx.closePath();ctx.fill();
}

function drawCityDetails(){
  // station sign
  rr(60,285,245,70,8,'#17466d');ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.fillText('VANYA CITY',85,332);
  // lamps
  for(let i=0;i<12;i++){let z=-.15+i*.1,y=roadY(z),d=depth(z),x=W/2-roadHalf(z)-42;ctx.strokeStyle='#59666b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-75*d-40);ctx.stroke();ctx.fillStyle='#ffe8a1';ctx.beginPath();ctx.arc(x,y-75*d-42,8*d+4,0,Math.PI*2);ctx.fill()}
}

function train(o){
  const d=depth(o.z),s=.22+1.15*d,x=roadX(o.l,o.z),y=roadY(o.z),w=150*s,h=185*s;
  ctx.save();ctx.translate(x,y-h*.05);
  ctx.shadowBlur=18*d;ctx.shadowColor='#0008';rr(-w/2,-h,w,h*.9,18*d,'#344d5b');
  ctx.shadowBlur=0;rr(-w*.42,-h*.73,w*.84,h*.35,10*d,'#75c9e8');rr(-w*.45,-h*.18,w*.9,h*.08,4,'#dfe8e8');
  ctx.fillStyle='#1e2a30';ctx.fillRect(-w*.44,-h*.06,w*.88,h*.12);
  ctx.fillStyle='#ffe39a';for(let sx of[-.32,.32]){ctx.beginPath();ctx.arc(sx*w,h*.06,9*d+4,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='#17242b';ctx.fillRect(-w*.32,-h*.88,w*.64,h*.22);
  ctx.restore();
}

function coin(c){
  const d=depth(c.z),s=.35+1.15*d,x=roadX(c.l,c.z),y=roadY(c.z)-115*d-20;
  ctx.save();ctx.translate(x,y);ctx.rotate(time*4+c.spin);ctx.shadowBlur=18;ctx.shadowColor='#ffc928';
  ctx.fillStyle='#ffc62b';ctx.strokeStyle='#fff2a4';ctx.lineWidth=5*d+1;ctx.beginPath();ctx.arc(0,0,24*s,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='#fff3a8';ctx.font='bold '+Math.max(12,22*s)+'px Arial';ctx.textAlign='center';ctx.fillText('★',0,8*s);ctx.restore();
}

function player(){
  const x=lerp(roadX(0,1),roadX(2,1),lane/2),base=1165-jump*250,run=Math.sin(time*18);
  ctx.save();ctx.translate(x,base);if(slide)ctx.scale(1.18,.62);
  ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,70,90,22,0,0,Math.PI*2);ctx.fill();
  // legs
  ctx.strokeStyle='#20252d';ctx.lineWidth=31;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-18,20);ctx.lineTo(-28+run*18,95);ctx.moveTo(18,20);ctx.lineTo(28-run*18,95);ctx.stroke();
  ctx.strokeStyle='#4b5561';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-28+run*18,62);ctx.lineTo(-28+run*18,95);ctx.moveTo(28-run*18,62);ctx.lineTo(28-run*18,95);ctx.stroke();
  // shoes
  ctx.fillStyle='#f5f7f8';rr(-52+run*18,90,48,20,8,'#f5f7f8');rr(4-run*18,90,48,20,8,'#e1e7eb');
  // jacket
  const body=ctx.createLinearGradient(-50,-80,50,55);body.addColorStop(0,'#1299d2');body.addColorStop(1,'#0a5d8b');rr(-52,-88,104,135,26,body);
  // backpack
  const bag=ctx.createLinearGradient(-38,-78,38,35);bag.addColorStop(0,'#202934');bag.addColorStop(1,'#0c1218');rr(-39,-76,78,110,18,bag);ctx.fillStyle='#fff';ctx.font='bold 48px Arial';ctx.textAlign='center';ctx.fillText('V',0,-16);
  // arms
  ctx.strokeStyle='#0c83ba';ctx.lineWidth=27;ctx.beginPath();ctx.moveTo(-43,-58);ctx.lineTo(-78-run*25,20);ctx.moveTo(43,-58);ctx.lineTo(78+run*25,20);ctx.stroke();
  // head/cap
  ctx.fillStyle='#d99b76';ctx.beginPath();ctx.arc(0,-112,39,0,Math.PI*2);ctx.fill();ctx.fillStyle='#151c24';ctx.beginPath();ctx.arc(0,-127,43,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-43,-133,86,13);
  ctx.restore();
}

function spawnStuff(){
  const l=Math.floor(Math.random()*3);trains.push({l,z:-.98,phase:Math.random()*9});
  const cl=Math.random()<.7?l:Math.floor(Math.random()*3);for(let i=0;i<8;i++)coinTrail.push({l:cl,z:-.78-i*.075,spin:i*.6});
}

function update(dt){
  time+=dt;dist+=speed*dt*.35;score+=Math.floor(dt*150*mult);mult=Math.min(9,2+Math.floor(dist/2));speed=Math.min(.55,speed+dt*.004);
  lane=lerp(lane,target,Math.min(1,dt*8));jump=Math.max(0,jump-dt*1.45);slide=Math.max(0,slide-dt*1.5);
  spawn-=dt;if(spawn<=0){spawnStuff();spawn=Math.max(.65,.95-(speed-.32)*.8)}
  for(let i=trains.length-1;i>=0;i--){const o=trains[i];o.z+=speed*dt*(1+Math.sin(time+o.phase)*.02);if(o.z>.98)trains.splice(i,1);else if(Math.abs(o.z-.73)<.055&&o.l===Math.round(lane)&&jump<.28){end();return}}
  for(let i=coinTrail.length-1;i>=0;i--){const c=coinTrail[i];c.z+=speed*dt;if(c.z>.98)coinTrail.splice(i,1);else if(Math.abs(c.z-.73)<.045&&c.l===Math.round(lane)){coins++;score+=80;coinTrail.splice(i,1);flash=.15}}
  shake=Math.max(0,shake-dt*3);flash=Math.max(0,flash-dt);
  document.getElementById('coins').textContent=coins;document.getElementById('score').textContent=String(score).padStart(6,'0');document.getElementById('mult').textContent=mult;document.getElementById('distance').textContent=dist.toFixed(1)+' km';
}

function draw(){
  ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake*18,(Math.random()-.5)*shake*18);
  drawSky();
  for(const o of trains)train(o);for(const c of coinTrail)coin(c);player();
  // subtle speed streaks
  ctx.globalAlpha=.10;ctx.strokeStyle='#fff';ctx.lineWidth=4;for(let i=0;i<24;i++){let x=Math.random()*W,y=500+Math.random()*800;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(x-W/2)*.14,y+110);ctx.stroke()}ctx.globalAlpha=1;
  ctx.restore();
  if(flash){ctx.fillStyle='#fff';ctx.globalAlpha=flash*2;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}

function loop(now){if(!running||paused)return;const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
function hint(){const g=document.getElementById('gesture');g.classList.add('show');clearTimeout(hintTimer);hintTimer=setTimeout(()=>g.classList.remove('show'),3200)}
function start(){running=true;paused=false;time=0;dist=1.2;score=2743;coins=128;mult=2;speed=.32;lane=target=1;jump=slide=0;trains=[];coinTrail=[];spawn=.2;hint();document.getElementById('start').classList.add('hide');document.getElementById('over').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;document.getElementById('finalScore').textContent=score;document.getElementById('finalCoins').textContent=coins;document.getElementById('over').classList.remove('hide')}
function action(a){if(!running||paused)return;hint();if(a==='l')target=Math.max(0,target-1);if(a==='r')target=Math.min(2,target+1);if(a==='u'&&jump<=0&&slide<=0)jump=1;if(a==='d'&&jump<=0)slide=.75}
let sx=0,sy=0;addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;if(Math.abs(dx)>Math.abs(dy))action(dx>0?'r':'l');else action(dy<0?'u':'d')},{passive:true});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')action('l');if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')action('r');if(e.key==='ArrowUp'||e.key.toLowerCase()==='w'||e.key===' ')action('u');if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')action('d')});
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;if(!paused){last=performance.now();requestAnimationFrame(loop)}};
draw();
})();
</script></body></html>
