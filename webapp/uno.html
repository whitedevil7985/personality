<style>

006}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:18px}.uno-card{width:100px;height:145px;border-radius:16px;background:#f9f8f2;border:5px solid #ddd;box-shadow:0 10px 24px #0008;display:flex;align-items:center;justify-content:center;position:relative}.uno-card:after{content:"UNO";font-weight:1000;font-size:30px;transform:rotate(-18deg);color:white;text-shadow:0 2px 3px #000;background:#e21d2d;border-radius:50%;padding:10px 4px}.played{width:94px;height:138px;transform:rotate(-7deg);color:white;font-size:62px;font-weight:1000;display:grid;place-items:center;border-radius:14px;border:4px solid white;box-shadow:0 8px 18px #0007}.played span{font-size:54px;text-shadow:0 2px 4px #0007}.red{background:#f05e5b}.green{background:#5fc57d}.blue{background:#5f9fdf}.yellow{background:#f5bd35;color:#4b3b0b}.wild{background:conic-gradient(#ef625e 0 25%,#f4c33d 0 50%,#61c981 0 75%,#62a4e1 0);color:white}.turn{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);background:#263019e8;border-radius:20px;padding:8px 14px;font-weight:1000;letter-spacing:1px}.yourturn{background:#f4d03f;color:#3d3000}.hand{display:flex;justify-content:center;align-items:flex-end;min-height:170px;padding:0 4px 12px;overflow-x:auto}.handcard{width:72px;height:112px;border-radius:12px;border:4px solid white;box-shadow:0 7px 14px #0007;margin-left:-14px;flex:0 0 auto;position:relative;display:grid;place-items:center;color:white;font-weight:1000;font-size:39px;transition:.15s}.handcard:first-child{margin-left:0}.handcard:hover,.handcard:focus{transform:translateY(-12px) rotate(0deg);z-index:3}.handcard small{font-size:18px}.controls{display:flex;gap:10px;justify-content:center;padding-bottom:8px}.control{border:1px solid #6b7c65;background:#21331fdd;color:#fff;border-radius:16px;padding:13px 18px;font-weight:900}.draw{background:#f1f1e8;color:#222}.msg{text-align:center;font-size:13px;color:#d6dbd2;min-height:22px}.modal{position:fixed;inset:0;background:#0009;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(340px,100%);background:#121713;border:1px solid #3b443b;border-radius:24px;padding:20px}.modalbox h3{margin-top:0}.colorgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cbtn{height:54px;border:0;border-radius:14px;font-weight:1000}.chatbox{display:none;position:fixed;right:14px;bottom:14px;width:min(330px,calc(100% - 28px));background:#101510;border:1px solid #3c443b;border-radius:18px;padding:12px;z-index:12}.chatbox.show{display:block}.messages{max-height:180px;overflow:auto;font-size:13px}.chatrow{display:flex;gap:6px;margin-top:8px}.chatrow input{flex:1;border-radius:10px;border:1px solid #555;background:#202620;color:white;padding:10px}.chatrow button{border:0;border-radius:10px;padding:0 12px}.error{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#2b1515;color:#ffdede;padding:10px 14px;border-radius:12px;z-index:20;display:none}.error.show{display:block}@media(max-width:420px){.center{gap:8px}.uno-card{width:82px;height:120px}.played{width:78px;height:116px}.handcard{width:62px;height:98px;font-size:31px}.table{min-height:500px}}
<style>

.handcard.unplayable{opacity:.42;filter:saturate(.55);cursor:not-allowed}.handcard.playable{box-shadow:0 0 0 3px #f7df4a,0 10px 22px #0008;cursor:pointer}.handcard.just-drawn{transform:translateY(-10px);box-shadow:0 0 0 4px #fff,0 0 24px #f7df4a}.handcard.unplayable:hover{transform:none}

<body><div class="app"><div class="top"><div class="title">🃏 Vanya UNO <small style="font-size:9px;color:#70e5ad;letter-spacing:1px"> LIVE</small></div><div class="dots">⋮</div></div><section id="lobby" class="lobby"><div class="kicker">LIVE ROOM LOBBY</div><div class="uno-logo">UNO</div><div class="sub">REAL-TIME MULTIPLAYER ARENA</div><div class="invite"><div class="label">INVITE LINK</div><div class="invite-row"><code id="invite">Creating room…</code><button class="copy" id="copy">⧉</button></div><div class="sep"></div><div class="players-title"><span>PLAYERS</span><span id="pcount">0/4</span></div><div id="players"></div><button id="addbot" class="botadd">♙ &nbsp; Add All Bot</button></div><div class="actions"><button class="leave" id="leave">↪</button><button class="start" id="start" disabled>▶ &nbsp; Start Game</button></div></section>
<section id="game" class="game" hidden><div class="gamebar"><div class="pill" id="roompill">UNO</div><div class="icons"><button class="iconbtn" id="chatBtn">◉</button><button class="iconbtn" id="logBtn">▤</button><button class="iconbtn" id="helpBtn">?</button></div></div><div class="table"><div id="topPlayers"></div><div class="center"><div class="uno-card"></div><div id="played" class="played red"><span>2</span></div></div><div id="turn" class="turn">WAITING...</div></div><div id="hand" class="hand"></div><div class="controls"><button class="control draw" id="draw">▣ &nbsp; Draw</button><button class="control" id="unoBtn">UNO</button></div><div class="msg" id="msg"></div></section></div>
<div id="colorModal" class="modal"><div class="modalbox"><h3>Choose color</h3><div class="colorgrid"><button class="cbtn red" data-c="red">RED</button><button class="cbtn green" data-c="green">GREEN</button><button class="cbtn blue" data-c="blue">BLUE</button><button class="cbtn yellow" data-c="yellow">YELLOW</button></div></div></div>
<div id="chat" class="chatbox"><div class="label">GAME CHAT</div><div id="messages" class="messages"></div><div class="chatrow"><input id="chatInput" maxlength="180" placeholder="Message..."><button id="sendChat">Send</button></div></div><div id="error" class="error"></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand()}
const root=location.origin, params=new URLSearchParams(location.search); let roomCode=params.get('room')||'', ws=null, state=null, chosenWild=null, ended=false;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function meName(){return tg?.initDataUnsafe?.user?.first_name||'Player'}
function showErr(s){$('error').textContent=s;$('error').classList.add('show');setTimeout(()=>$('error').classList.remove('show'),2400)}
async function api(path,opts={}){const r=await fetch(path,opts);return r.json()}
async function ensureRoom(){if(roomCode)return;const r=await api('/api/uno/rooms'+(new URLSearchParams(location.search).get('gc')?'?gc='+encodeURIComponent(new URLSearchParams(location.search).get('gc')):''),{method:'POST'});if(!r.ok){showErr('Could not create room');return}roomCode=r.room;history.replaceState({},'',`/uno?room=${roomCode}`)}
function inviteLink(){const bot='ItzVanyaBot';return `https://t.me/${bot}?startapp=uno_${roomCode}`}
function connect(){if(!roomCode||ended)return; const init=tg?.initData||''; ws=new WebSocket(`${location.origin.replace(/^http/,'ws')}/ws/uno/${roomCode}?initData=${encodeURIComponent(init)}`);ws.onopen=()=>send({type:'join',name:meName()});ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='game_ended'){ended=true;showErr(d.message||'Game ended from group.');return}handle(d)};ws.onclose=()=>{if(!ended)setTimeout(()=>connect(),1800)}}
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}
function cardClass(c){return c.color==='wild'?'wild':c.color}
function isPlayable(c){
  if(!state||!state.top)return false;
  if(c.color==='wild'){
    if(c.value==='+4'){
      const hasColoredMatch=(state.hand||[]).some(x=>x.id!==c.id&&x.color!=='wild'&&
        (x.color===(state.pending_color||state.top.color)||x.value===state.top.value));
      if(hasColoredMatch)return false;
    }
    return true;
  }
  const target=state.pending_color||state.top.color;
  return c.color===target||c.value===state.top.value;
}

function cardText(c){if(c.value==='+2')return '+2';if(c.value==='skip')return '⊘';if(c.value==='reverse')return '↻';if(c.value==='wild')return '★';if(c.value==='+4')return '+4';return c.value}
function renderLobby(){ $('invite').textContent=inviteLink(); $('pcount').textContent=`${state?.players?.length||0}/4`; const box=$('players');box.innerHTML='';(state?.players||[]).forEach((p,i)=>{const d=document.createElement('div');d.className='player';d.innerHTML=`<div class="avatar">${p.bot?'🤖':esc((p.name||'P').slice(0,1).toUpperCase())}</div><div class="pname">${esc(p.name)}<div class="host">${i===0?'HOST':''}</div></div>${p.id===state.you?'<span class="you">You</span>':''}`;box.appendChild(d)});$('start').disabled=(state?.players?.length||0)<2||state?.started;$('addbot').disabled=(state?.players?.length||0)>=4||state?.started}
function renderGame(){
  $('lobby').hidden=true;$('game').hidden=false;$('roompill').textContent=`ROOM ${state.room}`;
  const wrap=$('topPlayers');wrap.innerHTML='';
  (state.players||[]).forEach((p,i)=>{const d=document.createElement('div');d.className=`playerpos p${Math.min(i,3)}`;d.innerHTML=`<div class="face">${p.bot?'🤖':'🙂'}</div><div class="pname2">${esc(p.name)} ${p.id===state.you?'★':''}</div><div class="count">▱ ${p.count}</div>`;wrap.appendChild(d)});
  const t=state.players.find(p=>p.id===state.turn);const myTurn=t?.id===state.you;
  $('turn').textContent=t?(myTurn?'YOUR TURN':esc(t.name).toUpperCase()+"'S TURN"):'WAITING...';$('turn').className='turn '+(myTurn?'yourturn':'');
  const pc=state.top;$('played').className=`played ${cardClass(pc)}`;$('played').innerHTML=`<span>${esc(cardText(pc))}</span>`;
  renderHand();
  const playable=(state.hand||[]).some(isPlayable);
  $('draw').disabled=!state.started||!myTurn||!!state.winner||!!state.drawn_card||playable;
  $('draw').title=playable?'Play a matching card first':'Draw a card';
  $('unoBtn').disabled=!state.started||!state.you;
}
function renderHand(){
  const h=$('hand');h.innerHTML='';
  (state.hand||[]).forEach(c=>{
    const b=document.createElement('button');const playable=isPlayable(c)&&state.turn===state.you;const drawn=state.drawn_card===c.id;
    b.className=`handcard ${cardClass(c)} ${playable?'playable':'unplayable'} ${drawn?'just-drawn':''}`;
    b.innerHTML=`<span>${esc(cardText(c))}</span>`;b.title=drawn?'Drawn card — you may play this card':(playable?'Playable card':'Not playable right now');
    b.addEventListener('click',()=>play(c));h.appendChild(b);
  });
}
function play(c){
  if(state.turn!==state.you){showErr('Wait for your turn');return}
  if(!isPlayable(c)){showErr('That card cannot be played here');return}
  if(state.drawn_card&&state.drawn_card!==c.id){showErr('After drawing, you can only play the drawn card');return}
  if(c.color==='wild'){chosenWild=c;$('colorModal').classList.add('show');return}
  send({type:'play',card_id:c.id});
}
function handle(x){if(x.type==='error'){showErr(x.message);return}if(x.type==='chat'){const d=document.createElement('div');d.innerHTML=`<b>${esc(x.name)}:</b> ${esc(x.text)}`;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return}if(x.type==='state'){state=x; if(!state.started)renderLobby(); else renderGame();if(state.winner){const w=state.players.find(p=>p.id===state.winner);$('msg').textContent=`🏆 ${w?.name||'Player'} won UNO!`}}}
$('start').onclick=()=>send({type:'start'});$('addbot').onclick=()=>send({type:'add_bot'});$('draw').onclick=()=>send({type:'draw'});$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(inviteLink());$('msg').textContent='Invite link copied'}catch{showErr('Copy unavailable')}};$('leave').onclick=()=>{location.href='https://t.me/ItzVanyaBot'};$('chatBtn').onclick=()=>$('chat').classList.toggle('show');$('sendChat').onclick=()=>{const v=$('chatInput').value.trim();if(v){send({type:'chat',text:v});$('chatInput').value=''}};$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('sendChat').click()});$('helpBtn').onclick=()=>showErr('Match a color or number, or use a wild card.');$('unoBtn').onclick=()=>showErr('UNO called!');document.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{if(chosenWild){send({type:'play',card_id:chosenWild.id,color:b.dataset.c});chosenWild=null}$('colorModal').classList.remove('show')});
(async()=>{await ensureRoom();connect()})();
</script></body></html>
